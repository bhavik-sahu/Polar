server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: polar-backend

  datasource:
    url: jdbc:mysql://localhost:3306/polar_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: "2004"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  data:
    mongodb:
      uri: mongodb://localhost:27017/polar_db
      auto-index-creation: true

  main:
    allow-bean-definition-overriding: true

# Security & JWT Configuration
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  tracking:
    missed-ping-threshold-hours: 24
    missed-ping-check-cron: "0 0/15 * * * ?" # Every 15 minutes
    low-stock-check-cron: "0 0 * * * ?" # Every hour
    expiry-check-cron: "0 0 0 * * ?" # Daily at midnight

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
